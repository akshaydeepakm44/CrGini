<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="iconGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8B5CF6" />
      <stop offset="50%" stop-color="#7C3AED" />
      <stop offset="100%" stop-color="#4F46E5" />
    </linearGradient>
    <linearGradient id="cyanGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#06B6D4" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Glow Backdrop -->
  <rect x="15" y="15" width="90" height="90" rx="28" fill="#7C3AED" opacity="0.3" filter="url(#glow)" />
  
  <!-- Rounded Squircle Badge -->
  <rect x="10" y="10" width="100" height="100" rx="28" fill="url(#iconGrad)" />
  
  <!-- Monogram D -->
  <rect x="32" y="32" width="14" height="56" rx="7" fill="#FFFFFF" />
  <path d="M38 32 C72 32 88 45 88 60 C88 75 72 88 38 88" stroke="#FFFFFF" stroke-width="14" stroke-linecap="round" stroke-linejoin="round" fill="none" />
  
  <circle cx="52" cy="60" r="6" fill="url(#cyanGlow)" />
  <circle cx="88" cy="40" r="6" fill="url(#cyanGlow)" />
  <circle cx="88" cy="40" r="2.5" fill="#FFFFFF" />
</svg>