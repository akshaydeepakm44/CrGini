<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 130" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="iconGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8B5CF6" />
      <stop offset="50%" stop-color="#7C3AED" />
      <stop offset="100%" stop-color="#4F46E5" />
    </linearGradient>
    <linearGradient id="diziGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8B5CF6" />
      <stop offset="100%" stop-color="#6366F1" />
    </linearGradient>
    <linearGradient id="cyanGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#06B6D4" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Left Icon Mark -->
  <g transform="translate(10, 15)">
    <!-- Outer Glow -->
    <rect x="4" y="4" width="92" height="92" rx="24" fill="#7C3AED" opacity="0.2" filter="url(#glow)" />
    <!-- Rounded Squircle Badge -->
    <rect x="0" y="0" width="100" height="100" rx="24" fill="url(#iconGrad)" />
    
    <!-- Monogram D -->
    <!-- Vertical Pillar -->
    <rect x="22" y="22" width="14" height="56" rx="7" fill="#FFFFFF" />
    
    <!-- Curved Ring of D -->
    <path d="M28 22 C62 22 78 35 78 50 C78 65 62 78 28 78" stroke="#FFFFFF" stroke-width="14" stroke-linecap="round" stroke-linejoin="round" fill="none" />
    
    <!-- Inner Core Spark -->
    <circle cx="42" cy="50" r="6" fill="url(#cyanGlow)" />
    
    <!-- Orbital Digital Satellite Node -->
    <circle cx="78" cy="30" r="6" fill="url(#cyanGlow)" />
    <circle cx="78" cy="30" r="2.5" fill="#FFFFFF" />
  </g>

  <!-- Typography -->
  <!-- DiziGini Wordmark -->
  <text x="132" y="68" font-family="'Plus Jakarta Sans', 'Segoe UI', -apple-system, sans-serif" font-size="46" font-weight="800" letter-spacing="-0.03em" fill="#0F172A">
    Dizi<tspan fill="url(#diziGrad)">Gini</tspan>
  </text>

  <!-- Pill Badge: DIGITALISING -->
  <g transform="translate(325, 36)">
    <rect x="0" y="0" width="110" height="24" rx="12" fill="#F5F3FF" stroke="#DDD4FA" stroke-width="1.5" />
    <text x="55" y="16" text-anchor="middle" font-family="'Plus Jakarta Sans', 'Segoe UI', sans-serif" font-size="10.5" font-weight="800" letter-spacing="0.06em" fill="#7C3AED">
      DIGITALISING
    </text>
  </g>

  <!-- Subtitle / Domain -->
  <text x="133" y="94" font-family="'Inter', 'Segoe UI', sans-serif" font-size="13.5" font-weight="600" letter-spacing="0.01em" fill="#64748B">
    dizigini.com <tspan fill="#06B6D4" font-weight="800">·</tspan> B2B Intelligence &amp; Digitalisation
  </text>
</svg>