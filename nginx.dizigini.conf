# ==============================================================================
# DiziGini Production Nginx Server Configuration
# Domain: http://dizigini.com / http://www.dizigini.com
# ==============================================================================

upstream dizigini_api {
    server 127.0.0.1:5000;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name dizigini.com www.dizigini.com;

    # Maximum file upload size (matches backend 150MB limit for research deliverables)
    client_max_body_size 150M;

    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/rss+xml application/atom+xml image/svg+xml;

    # --------------------------------------------------------------------------
    # 1. Frontend Static Single-Page Application (SPA)
    # Adjust this root path to wherever the repository is deployed on your server:
    # Example: /var/www/dizi/frontend/dist or /home/ubuntu/dizi/frontend/dist
    # --------------------------------------------------------------------------
    root /var/www/dizi/frontend/dist;
    index index.html;

    # --------------------------------------------------------------------------
    # 2. API Reverse Proxy -> Node.js Express Backend (Port 5000)
    # --------------------------------------------------------------------------
    location /api/ {
        proxy_pass http://dizigini_api;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket support for live notifications
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_connect_timeout 60s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;

        # Disable proxy buffering for instant real-time responses
        proxy_buffering off;
    }

    # --------------------------------------------------------------------------
    # 3. Static Media & Storage Deliverables
    # --------------------------------------------------------------------------
    location /storage/ {
        proxy_pass http://dizigini_api/storage/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /uploads/ {
        proxy_pass http://dizigini_api/uploads/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # --------------------------------------------------------------------------
    # 4. Static Asset Caching (JS, CSS, Images, Fonts)
    # --------------------------------------------------------------------------
    location ~* \.(?:ico|css|js|gif|jpe?g|png|svg|woff2?|eot|ttf|otf)$ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
        try_files $uri =404;
    }

    # --------------------------------------------------------------------------
    # 5. SPA Routing Fallback (All client-side routes -> index.html)
    # Handles /portal, /lead, /admin, /signin deep links
    # --------------------------------------------------------------------------
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }
}
